  <text x="675.0" y="92.5" font-size="21.0" font-weight="700" fill="#ffffff">
    <tspan>Internet of Things e</tspan>
    <tspan x="675.0" dy="26.0">Protocolli Applicativi</tspan>
  </text>
  <text x="110.0" y="247.7" font-size="16.0" font-weight="700" fill="#6ee7b7">
    <tspan>Architettura di Rete e</tspan>
    <tspan x="110.0" dy="20.8">Paradigmi del Sistema</tspan>
  </text>
  <text x="120.0" y="370.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Smart Object (Things):</tspan>
    <tspan x="120.0" dy="18.2">sensori, attuatori e MCU vincolate</tspan>
  </text>
  <text x="120.0" y="480.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>IoT Gateway ed Edge Computing</tspan>
    <tspan x="120.0" dy="18.2">per bridging di protocollo</tspan>
  </text>
  <text x="120.0" y="590.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Vincoli di memoria, energia</tspan>
    <tspan x="120.0" dy="18.2">e larghezza di banda</tspan>
  </text>
  <text x="120.0" y="700.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Modello Request-Response vs</tspan>
    <tspan x="120.0" dy="18.2">Publish-Subscribe asincrono</tspan>
  </text>
  <text x="410.0" y="247.7" font-size="16.0" font-weight="700" fill="#6ee7b7">
    <tspan>Protocollo HTTP e</tspan>
    <tspan x="410.0" dy="20.8">Architettura RESTful</tspan>
  </text>
  <text x="420.0" y="370.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Identificazione delle risorse</tspan>
    <tspan x="420.0" dy="18.2">tramite URI / URL univoci</tspan>
  </text>
  <text x="420.0" y="480.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Verbi HTTP CRUD:</tspan>
    <tspan x="420.0" dy="18.2">GET, POST, PUT, DELETE</tspan>
  </text>
  <text x="420.0" y="590.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Codici di stato HTTP:</tspan>
    <tspan x="420.0" dy="18.2">200 OK, 201 Created, 404, 500</tspan>
  </text>
  <text x="420.0" y="700.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Formati payload dati:</tspan>
    <tspan x="420.0" dy="18.2">JSON compatto vs XML verboso</tspan>
  </text>
  <text x="710.0" y="247.7" font-size="16.0" font-weight="700" fill="#6ee7b7">
    <tspan>Meccanismi di Trasferimento:</tspan>
    <tspan x="710.0" dy="20.8">Polling vs Notifica WebHook</tspan>
  </text>
  <text x="720.0" y="370.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Polling periodico sincrono</tspan>
    <tspan x="720.0" dy="18.2">e ritardo medio di rilevazione</tspan>
  </text>
  <text x="720.0" y="480.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Overhead elevato di HTTP</tspan>
    <tspan x="720.0" dy="18.2">in assenza di variazioni dati</tspan>
  </text>
  <text x="720.0" y="590.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Notifica asincrona su evento</tspan>
    <tspan x="720.0" dy="18.2">(Event-driven Webhook)</tspan>
  </text>
  <text x="720.0" y="700.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Confronto analitico di efficienza</tspan>
    <tspan x="720.0" dy="18.2">in funzione del change rate</tspan>
  </text>
  <text x="1010.0" y="247.7" font-size="16.0" font-weight="700" fill="#6ee7b7">
    <tspan>Protocollo MQTT e</tspan>
    <tspan x="1010.0" dy="20.8">Spazio di Indirizzamento Topic</tspan>
  </text>
  <text x="1020.0" y="370.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Ruolo del Broker centrale e</tspan>
    <tspan x="1020.0" dy="18.2">disaccoppiamento spazio/tempo</tspan>
  </text>
  <text x="1020.0" y="480.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Topic gerarchici separati</tspan>
    <tspan x="1020.0" dy="18.2">da slash (/)</tspan>
  </text>
  <text x="1020.0" y="590.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Caratteri Wildcard: '+' singolo</tspan>
    <tspan x="1020.0" dy="18.2">livello e '#' multilivello</tspan>
  </text>
  <text x="1020.0" y="700.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Connessione persistente TCP e</tspan>
    <tspan x="1020.0" dy="18.2">meccanismo Keep-Alive PING</tspan>
  </text>
  <text x="1310.0" y="247.7" font-size="16.0" font-weight="700" fill="#6ee7b7">
    <tspan>Affidabilità, Controllo di Stato</tspan>
    <tspan x="1310.0" dy="20.8">e Gestione Disconnessioni</tspan>
  </text>
  <text x="1320.0" y="370.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Livelli di QoS: QoS 0 (fire&amp;forget),</tspan>
    <tspan x="1320.0" dy="18.2">QoS 1 (ACK) e QoS 2 (4-way)</tspan>
  </text>
  <text x="1320.0" y="480.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Retained Messages per lettura</tspan>
    <tspan x="1320.0" dy="18.2">immediata ultimo valore valido</tspan>
  </text>
  <text x="1320.0" y="590.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Last Will and Testament (LWT)</tspan>
    <tspan x="1320.0" dy="18.2">per disconnessioni anomale</tspan>
  </text>
  <text x="1320.0" y="700.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Sessioni persistenti CleanSession=0</tspan>
    <tspan x="1320.0" dy="18.2">con buffering messaggi offline</tspan>
  </text>
  <text x="447.5" y="177.0" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>si struttura in</tspan>
  </text>
  <text x="145.0" y="314.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>acquisisce grandezze</tspan>
  </text>
  <text x="137.0" y="369.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>collega verso Internet</tspan>
  </text>
  <text x="169.0" y="424.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>limita risorse</tspan>
  </text>
  <text x="149.0" y="479.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>confronta paradigmi</tspan>
  </text>
  <text x="577.5" y="177.0" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>utilizza nel Web con</tspan>
  </text>
  <text x="453.0" y="314.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>indirizza endpoint</tspan>
  </text>
  <text x="469.0" y="369.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>manipola stato</tspan>
  </text>
  <text x="469.0" y="424.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>notifica esito</tspan>
  </text>
  <text x="457.0" y="479.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>serializza misure</tspan>
  </text>
  <text x="745.0" y="179.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>sincronizza dati con</tspan>
  </text>
  <text x="737.0" y="314.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>interroga a intervalli</tspan>
  </text>
  <text x="753.0" y="369.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>spreca banda radio</tspan>
  </text>
  <text x="729.0" y="424.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>trasmette solo al cambio</tspan>
  </text>
  <text x="733.0" y="479.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>quantifica soglia utile</tspan>
  </text>
  <text x="900.5" y="177.0" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>comunica in pub/sub con</tspan>
  </text>
  <text x="1065.0" y="314.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>smista messaggi</tspan>
  </text>
  <text x="1045.0" y="369.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>organizza alberatura</tspan>
  </text>
  <text x="1053.0" y="424.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>sottoscrive gruppi</tspan>
  </text>
  <text x="1037.0" y="479.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>mantiene canale aperto</tspan>
  </text>
  <text x="1034.5" y="177.0" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>garantisce affidabilità con</tspan>
  </text>
  <text x="1361.0" y="314.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>gradua sicurezza</tspan>
  </text>
  <text x="1349.0" y="369.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>memorizza su broker</tspan>
  </text>
  <text x="1349.0" y="424.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>avvisa i subscriber</tspan>
  </text>
  <text x="1373.0" y="479.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>preserva coda</tspan>
  </text>
  <text x="563.0" y="432.0" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>funge da client verso broker</tspan>
  </text>
  <text x="879.0" y="487.0" font-size="12.0" font-weight="500" fill="#f8fafc">
