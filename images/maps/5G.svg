  <text x="675.0" y="92.5" font-size="21.0" font-weight="700" fill="#ffffff">
    <tspan>Sistemi 5G New Radio</tspan>
    <tspan x="675.0" dy="26.0">e Core Network (5GC)</tspan>
  </text>
  <text x="110.0" y="247.7" font-size="16.0" font-weight="500" fill="#f8fafc">
    <tspan>Classi di Servizio ITU-R</tspan>
    <tspan x="110.0" dy="20.8">e Casi d'Uso 5G</tspan>
  </text>
  <text x="120.0" y="370.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>eMBB: banda ultralarga</tspan>
    <tspan x="120.0" dy="18.2">fino a 20 Gbps di picco</tspan>
  </text>
  <text x="120.0" y="480.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>URLLC: comunicazioni ultra-</tspan>
    <tspan x="120.0" dy="18.2">affidabili con latenza &lt; 1 ms</tspan>
  </text>
  <text x="120.0" y="590.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>mMTC: connessione massiva</tspan>
    <tspan x="120.0" dy="18.2">fino a 10^6 dispositivi/km^2</tspan>
  </text>
  <text x="120.0" y="700.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Radar chart ITU-R e</tspan>
    <tspan x="120.0" dy="18.2">requisiti prestazionali</tspan>
  </text>
  <text x="410.0" y="247.7" font-size="16.0" font-weight="500" fill="#f8fafc">
    <tspan>Spettro di Frequenza e</tspan>
    <tspan x="410.0" dy="20.8">Interfaccia Radio NR</tspan>
  </text>
  <text x="420.0" y="370.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Bande FR1 (Sub-6 GHz) per</tspan>
    <tspan x="420.0" dy="18.2">copertura e capacità macro</tspan>
  </text>
  <text x="420.0" y="480.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Bande FR2 (mmWave 24-100 GHz)</tspan>
    <tspan x="420.0" dy="18.2">per hotspot e capacità estrema</tspan>
  </text>
  <text x="420.0" y="590.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Modulazione ad alto ordine</tspan>
    <tspan x="420.0" dy="18.2">fino a 256-QAM</tspan>
  </text>
  <text x="420.0" y="700.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Codici LDPC per canale dati</tspan>
    <tspan x="420.0" dy="18.2">e Polar Codes per controllo</tspan>
  </text>
  <text x="710.0" y="247.7" font-size="16.0" font-weight="500" fill="#f8fafc">
    <tspan>Numerologia Flessibile e</tspan>
    <tspan x="710.0" dy="20.8">Struttura di Slot</tspan>
  </text>
  <text x="720.0" y="370.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Spaziatura sottoportanti</tspan>
    <tspan x="720.0" dy="18.2">scalabile df = 15*2^mu kHz</tspan>
  </text>
  <text x="720.0" y="480.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Durata slot inversa mu:</tspan>
    <tspan x="720.0" dy="18.2">da 1 ms (mu=0) a 62.5 us</tspan>
  </text>
  <text x="720.0" y="590.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Self-contained slot con</tspan>
    <tspan x="720.0" dy="18.2">DL, UL e guard time integrati</tspan>
  </text>
  <text x="720.0" y="700.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Mini-slot per trasmissione</tspan>
    <tspan x="720.0" dy="18.2">immediata a bassa latenza</tspan>
  </text>
  <text x="1010.0" y="247.7" font-size="16.0" font-weight="500" fill="#f8fafc">
    <tspan>Architetture di Deployment:</tspan>
    <tspan x="1010.0" dy="20.8">NSA vs SA</tspan>
  </text>
  <text x="1020.0" y="370.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Opzione NSA (Option 3x):</tspan>
    <tspan x="1020.0" dy="18.2">en-gNB ancorato a MeNB ed EPC</tspan>
  </text>
  <text x="1020.0" y="480.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Opzione Standalone (Option 2):</tspan>
    <tspan x="1020.0" dy="18.2">gNB puro collegato a 5G Core</tspan>
  </text>
  <text x="1020.0" y="590.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Dual Connectivity tra</tspan>
    <tspan x="1020.0" dy="18.2">stazioni radio 4G e 5G</tspan>
  </text>
  <text x="1020.0" y="700.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Evoluzione transitoria da</tspan>
    <tspan x="1020.0" dy="18.2">EPC legacy a 5GC nativo</tspan>
  </text>
  <text x="1310.0" y="247.7" font-size="16.0" font-weight="500" fill="#f8fafc">
    <tspan>5G Core Network, SBA e</tspan>
    <tspan x="1310.0" dy="20.8">Network Slicing</tspan>
  </text>
  <text x="1320.0" y="370.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Service-Based Architecture:</tspan>
    <tspan x="1320.0" dy="18.2">funzioni AMF, SMF, UPF su HTTP/2</tspan>
  </text>
  <text x="1320.0" y="480.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Separazione CUPS:</tspan>
    <tspan x="1320.0" dy="18.2">User Plane Function separata</tspan>
  </text>
  <text x="1320.0" y="590.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Network Slicing end-to-end</tspan>
    <tspan x="1320.0" dy="18.2">con istanze logiche isolate</tspan>
  </text>
  <text x="1320.0" y="700.8" font-size="14.0" font-weight="500" fill="#f8fafc">
    <tspan>Massive MIMO e 3D Beamforming</tspan>
    <tspan x="1320.0" dy="18.2">con array ad antenne multiple</tspan>
  </text>
  <text x="435.5" y="177.0" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>risponde a scenari</tspan>
  </text>
  <text x="141.0" y="314.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>massimizza throughput</tspan>
  </text>
  <text x="169.0" y="369.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>riduce ritardo</tspan>
  </text>
  <text x="157.0" y="424.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>scala densità IoT</tspan>
  </text>
  <text x="161.0" y="479.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>confronta con 4G</tspan>
  </text>
  <text x="593.5" y="177.0" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>opera su spettro</tspan>
  </text>
  <text x="441.0" y="314.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>assicura penetrazione</tspan>
  </text>
  <text x="437.0" y="369.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>fornisce canali larghi</tspan>
  </text>
  <text x="449.0" y="424.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>aumenta bit/simbolo</tspan>
  </text>
  <text x="441.0" y="479.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>massimizza correzione</tspan>
  </text>
  <text x="761.0" y="179.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>adatta trama con</tspan>
  </text>
  <text x="765.0" y="314.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>scala frequenze</tspan>
  </text>
  <text x="741.0" y="369.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>riduce durata simboli</tspan>
  </text>
  <text x="725.0" y="424.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>fornisce riscontro rapido</tspan>
  </text>
  <text x="733.0" y="479.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>preempta traffico URLLC</tspan>
  </text>
  <text x="900.5" y="177.0" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>si distribuisce secondo</tspan>
  </text>
  <text x="1061.0" y="314.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>accelera rollout</tspan>
  </text>
  <text x="1037.0" y="369.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>sblocca piene funzioni</tspan>
  </text>
  <text x="1045.0" y="424.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>aggrega flussi radio</tspan>
  </text>
  <text x="1045.0" y="479.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>migra infrastruttura</tspan>
  </text>
  <text x="1042.5" y="177.0" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>gestisce intelligenza con</tspan>
  </text>
  <text x="1345.0" y="314.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>virtualizza funzioni</tspan>
  </text>
  <text x="1341.0" y="369.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>decentra dati ad edge</tspan>
  </text>
  <text x="1345.0" y="424.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>dedica risorse a SLA</tspan>
  </text>
  <text x="1329.0" y="479.5" font-size="12.0" font-weight="500" fill="#f8fafc">
    <tspan>concentra lobi su utenti</tspan>
  </text>
